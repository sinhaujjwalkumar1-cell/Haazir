<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Ads | Service By Local</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            /* --- PREMIUM PALETTE --- */
            --primary: #008F5D;
            --primary-light: #E8F5E9; 
            --bg-body: #F5F5F7;
            --bg-card: #FFFFFF;
            --text-dark: #1D1D1F;
            --text-grey: #86868b;
            --danger: #FF3B30;
            --warning: #FF9500;
            --shadow-card: 0 4px 20px rgba(0,0,0,0.03);
        }

        * { margin:0; padding:0; box-sizing:border-box; font-family:'Outfit',sans-serif; -webkit-tap-highlight-color:transparent; }
        body { background:var(--bg-body); color:var(--text-dark); padding-bottom: 120px; }

        /* --- HEADER AREA --- */
        .header-main {
            padding: 20px 20px 10px 20px;
            background: rgba(245, 245, 247, 0.95);
            position: sticky; top: 0; z-index: 100;
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0,0,0,0.03);
        }

        /* --- HERO CARD (Event Style) --- */
        .hero-card {
            background: linear-gradient(135deg, rgba(0, 143, 93, 0.05) 0%, rgba(0, 143, 93, 0.15) 100%);
            border-radius: 24px;
            padding: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            border: 1px solid rgba(0, 143, 93, 0.05);
        }

        .hero-text { display: flex; flex-direction: column; gap: 5px; }
        .hero-title { font-size: 1.8rem; font-weight: 800; color: var(--primary); letter-spacing: -0.5px; line-height: 1.2; }
        .hero-desc { font-size: 0.85rem; color: var(--text-grey); font-weight: 500; }

        .hero-icon-box {
            width: 60px; height: 60px;
            background: white;
            border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
            color: var(--primary);
            font-size: 1.5rem;
            box-shadow: 0 8px 20px rgba(0, 143, 93, 0.15);
        }

        /* --- STATS DASHBOARD --- */
        .stats-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 20px;
        }

        .stat-box {
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: var(--shadow-card);
            text-align: center;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.02);
        }
        
        .stat-box::after {
            content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(90deg, var(--primary), transparent);
        }

        .stat-num { font-size: 1.8rem; font-weight: 800; color: var(--text-dark); line-height: 1.2; }
        .stat-label { font-size: 0.8rem; color: var(--text-grey); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-icon { font-size: 1.2rem; color: var(--primary); margin-bottom: 8px; }

        /* --- AD LIST --- */
        .section-heading {
            padding: 0 20px 15px 20px;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-dark);
            display: flex; justify-content: space-between; align-items: center;
        }

        .ads-container { padding: 0 20px; display: flex; flex-direction: column; gap: 15px; }

        .ad-card {
            background: white;
            border-radius: 24px;
            padding: 15px;
            box-shadow: var(--shadow-card);
            display: flex;
            flex-direction: column;
            gap: 15px;
            transition: 0.2s;
            border: 1px solid rgba(0,0,0,0.02);
        }
        .ad-card:active { transform: scale(0.98); }

        .ad-top { display: flex; gap: 15px; }
        
        .ad-img-box {
            width: 80px; height: 80px;
            border-radius: 18px;
            overflow: hidden;
            flex-shrink: 0;
            background: #f0f0f0;
        }
        .ad-img { width: 100%; height: 100%; object-fit: cover; }

        .ad-info { flex: 1; display: flex; flex-direction: column; justify-content: center; }
        
        .ad-title { font-size: 1.1rem; font-weight: 700; color: var(--text-dark); margin-bottom: 4px; }
        .ad-price { color: var(--primary); font-weight: 700; font-size: 0.95rem; }
        
        .ad-meta { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
        .view-count { font-size: 0.75rem; color: var(--text-grey); display: flex; align-items: center; gap: 4px; }

        .status-badge { font-size: 0.7rem; padding: 4px 10px; border-radius: 20px; font-weight: 600; display: inline-block; }
        .st-active { background: #DCFCE7; color: #166534; }
        .st-review { background: #FFF7ED; color: #C2410C; }

        .ad-actions { display: flex; gap: 10px; border-top: 1px solid #F5F5F7; padding-top: 15px; }

        .action-btn {
            flex: 1; padding: 10px; border-radius: 12px; border: none; font-size: 0.9rem; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 6px; transition: 0.2s;
        }
        .btn-edit { background: #F5F5F7; color: var(--text-dark); }
        .btn-delete { background: #FEF2F2; color: var(--danger); }

        .empty-state { text-align: center; padding: 40px 20px; display: none; }
        .empty-icon { font-size: 3rem; color: #ddd; margin-bottom: 15px; }
        .empty-text { color: var(--text-grey); font-size: 0.95rem; }

        .create-btn-lg {
            background: var(--primary); color: white; width: 100%; padding: 16px; border-radius: 50px;
            font-size: 1rem; font-weight: 700; border: none; margin-top: 20px; box-shadow: 0 10px 25px rgba(0, 143, 93, 0.3);
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }

        /* --- BOTTOM DOCK (PREMIUM WHITE) --- */
        .bottom-dock { 
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); 
            width: 92%; max-width: 500px; 
            background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(20px); 
            padding: 12px 25px; 
            border-radius: 60px; 
            display: flex; justify-content: space-between; align-items: center; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.1); 
            border: 1px solid rgba(0,0,0,0.05);
            z-index: 1000; 
        }
        .dock-item { 
            display: flex; flex-direction: column; align-items: center; gap: 4px; 
            color: #86868b; 
            text-decoration: none; font-size: 0.7rem; font-weight: 500; 
            transition: 0.2s; 
        }
        .dock-item.active { color: var(--primary); font-weight: 700; }
        .dock-item i { font-size: 1.4rem; }
        .dock-add-btn { 
            width: 55px; height: 55px; background: var(--primary); border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            color: white; font-size: 1.8rem; transform: translateY(-25px); 
            border: 4px solid var(--bg-body); box-shadow: 0 10px 25px rgba(0, 143, 93, 0.4); 
        }
        .dock-add-btn:active { transform: translateY(-25px) scale(0.95); }

    </style>
</head>
<body>

    <div class="header-main">
        <div class="hero-card">
            <div class="hero-text">
                <div class="hero-title">My Ads</div>
                <div class="hero-desc">Manage your service listings.</div>
            </div>
            <div class="hero-icon-box">
                <i class="fas fa-bullhorn"></i>
            </div>
        </div>
    </div>

    <div class="stats-container">
        <div class="stat-box">
            <div class="stat-icon"><i class="fas fa-eye"></i></div>
            <div class="stat-num">1,204</div>
            <div class="stat-label">Total Views</div>
        </div>
        <div class="stat-box">
            <div class="stat-icon"><i class="fas fa-phone-alt"></i></div>
            <div class="stat-num">42</div>
            <div class="stat-label">Total Calls</div>
        </div>
    </div>

    <div class="section-heading">
        <span>Your Listings</span>
        <span style="font-size:0.8rem; color:var(--primary);">2 Active</span>
    </div>

    <div class="ads-container" id="adsList">
        <div class="ad-card">
            <div class="ad-top">
                <div class="ad-img-box">
                    <img src="https://images.unsplash.com/photo-1621905251189-08b45d6a269e?auto=format&fit=crop&w=150&q=80" class="ad-img">
                </div>
                <div class="ad-info">
                    <div class="ad-title">AC Repair Service</div>
                    <div class="ad-price">₹599 <span style="font-size:0.7rem; font-weight:400; color:#999;">/ Visit</span></div>
                    <div class="ad-meta">
                        <span class="status-badge st-active">Active</span>
                        <span class="view-count"><i class="far fa-eye"></i> 850</span>
                    </div>
                </div>
            </div>
            <div class="ad-actions">
                <button class="action-btn btn-edit"><i class="fas fa-pen"></i> Edit</button>
                <button class="action-btn btn-edit"><i class="fas fa-pause"></i> Pause</button>
                <button class="action-btn btn-delete" onclick="deleteAd(this)"><i class="fas fa-trash"></i></button>
            </div>
        </div>

        <div class="ad-card">
            <div class="ad-top">
                <div class="ad-img-box">
                    <img src="https://images.unsplash.com/photo-1581578731117-10d52143b0e8?auto=format&fit=crop&w=150&q=80" class="ad-img">
                </div>
                <div class="ad-info">
                    <div class="ad-title">Washing Machine Fix</div>
                    <div class="ad-price">₹499 <span style="font-size:0.7rem; font-weight:400; color:#999;">/ Visit</span></div>
                    <div class="ad-meta">
                        <span class="status-badge st-review">Under Review</span>
                    </div>
                </div>
            </div>
            <div class="ad-actions">
                <button class="action-btn btn-edit"><i class="fas fa-pen"></i> Edit</button>
                <button class="action-btn btn-delete" onclick="deleteAd(this)"><i class="fas fa-trash"></i></button>
            </div>
        </div>
    </div>

    <div class="empty-state" id="emptyState">
        <div class="empty-icon"><i class="fas fa-box-open"></i></div>
        <p class="empty-text">You haven't posted any ads yet.</p>
        <button class="create-btn-lg" onclick="window.location.href='add-service.html'">
            <i class="fas fa-plus-circle"></i> Post Your First Ad
        </button>
    </div>

    <div class="bottom-dock">
        <a href="index.html" class="dock-item"><i class="fas fa-home"></i><span>Home</span></a>
        <a href="chat.html" class="dock-item"><i class="far fa-comment-dots"></i><span>Chat</span></a>
        <a href="add-service.html" class="dock-add-btn"><i class="fas fa-plus"></i></a>
        <a href="my-ads.html" class="dock-item active"><i class="fas fa-list-alt"></i><span>My Ads</span></a>
        <a href="account.html" class="dock-item"><i class="far fa-user"></i><span>Profile</span></a>
    </div>

    <script>
        function deleteAd(btn) {
            if(confirm('Are you sure you want to delete this ad?')) {
                const card = btn.closest('.ad-card');
                card.style.opacity = '0';
                card.style.transform = 'scale(0.9)';
                setTimeout(() => {
                    card.remove();
                    checkEmpty();
                }, 300);
            }
        }

        function checkEmpty() {
            const container = document.getElementById('adsList');
            if(container.children.length === 0) {
                document.getElementById('emptyState').style.display = 'block';
                document.querySelector('.section-heading').style.display = 'none';
            }
        }
    </script>

</body>
</html>
