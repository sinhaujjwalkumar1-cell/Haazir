<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Account | Service By Local</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #008F5D;
            --primary-light: #E8F5E9;
            --bg-body: #F5F5F7;
            --bg-card: #FFFFFF;
            --text-dark: #1D1D1F;
            --text-grey: #86868b;
            --shadow: 0 4px 20px rgba(0,0,0,0.03);
            --danger: #FF3B30;
        }

        * { margin:0; padding:0; box-sizing:border-box; font-family:'Outfit',sans-serif; -webkit-tap-highlight-color:transparent; }
        body { background:var(--bg-body); color:var(--text-dark); padding-bottom:120px; }

        /* --- HERO HEADER --- */
        .account-header {
            background: white;
            padding: 30px 20px 20px 20px;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            box-shadow: var(--shadow);
            text-align: center;
            position: relative;
        }

        .profile-pic-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 15px;
        }

        .profile-img {
            width: 100%; height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--primary-light);
            padding: 2px;
        }

        .edit-icon {
            position: absolute;
            bottom: 0; right: 0;
            background: var(--primary);
            color: white;
            width: 30px; height: 30px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.9rem;
            border: 3px solid white;
        }

        .user-name { font-size: 1.5rem; font-weight: 800; margin-bottom: 4px; }
        .user-contact { font-size: 0.9rem; color: var(--text-grey); font-weight: 500; }
        .edit-profile-btn {
            margin-top: 15px;
            background: var(--text-dark);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* --- MENU LIST --- */
        .menu-section { padding: 20px; }
        .menu-title { font-size: 0.9rem; font-weight: 700; color: var(--text-grey); margin-bottom: 10px; margin-left: 10px; text-transform: uppercase; letter-spacing: 1px; }

        .menu-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--shadow);
            border: 1px solid rgba(0,0,0,0.02);
        }

        .menu-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 18px 20px;
            border-bottom: 1px solid #F5F5F7;
            text-decoration: none;
            color: var(--text-dark);
            transition: 0.2s;
        }
        .menu-item:last-child { border-bottom: none; }
        .menu-item:active { background: #f9f9f9; }

        .menu-left { display: flex; align-items: center; gap: 15px; }
        .menu-icon {
            width: 35px; height: 35px;
            border-radius: 10px;
            background: var(--bg-body);
            display: flex; align-items: center; justify-content: center;
            color: var(--primary);
            font-size: 1.1rem;
        }
        .menu-text { font-size: 1rem; font-weight: 600; }
        
        .arrow-icon { color: #ccc; font-size: 0.9rem; }

        /* Logout Button */
        .logout-btn {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            width: 90%; margin: 20px auto;
            padding: 15px;
            background: #FFE5E5;
            color: var(--danger);
            border-radius: 18px;
            font-weight: 700;
            border: none;
            cursor: pointer;
        }

        /* --- BOTTOM NAV (Same as Index) --- */
        .bottom-dock { position:fixed; bottom:25px; left:50%; transform:translateX(-50%); width:92%; max-width:500px; background:rgba(29,29,31,0.95); backdrop-filter:blur(20px); padding:12px 25px; border-radius:60px; display:flex; justify-content:space-between; align-items:center; box-shadow:0 20px 50px rgba(0,0,0,0.3); z-index:1000; }
        .dock-item { display:flex; flex-direction:column; align-items:center; gap:4px; color:#8E8E93; text-decoration:none; font-size:0.7rem; font-weight:500; }
        .dock-item.active { color:white; }
        .dock-item i { font-size:1.4rem; }
        .dock-add-btn { width:55px; height:55px; background:var(--primary); border-radius:50%; display:flex; align-items:center; justify-content:center; color:white; font-size:1.8rem; transform:translateY(-25px); border:4px solid var(--bg-body); }

    </style>
</head>
<body>

    <div class="account-header">
        <div class="profile-pic-container">
            <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" class="profile-img">
            <div class="edit-icon"><i class="fas fa-camera"></i></div>
        </div>
        <div class="user-name">Rahul Singh</div>
        <div class="user-contact">+91 98765 43210 | rahul@email.com</div>
        <button class="edit-profile-btn">Edit Profile</button>
    </div>

    <div class="menu-section">
        <div class="menu-title">My Activity</div>
        <div class="menu-card">
            <a href="#" class="menu-item">
                <div class="menu-left">
                    <div class="menu-icon"><i class="fas fa-calendar-check"></i></div>
                    <div class="menu-text">My Bookings</div>
                </div>
                <i class="fas fa-chevron-right arrow-icon"></i>
            </a>
            <a href="#" class="menu-item">
                <div class="menu-left">
                    <div class="menu-icon"><i class="fas fa-heart"></i></div>
                    <div class="menu-text">Saved Services</div>
                </div>
                <i class="fas fa-chevron-right arrow-icon"></i>
            </a>
        </div>
    </div>

    <div class="menu-section" style="padding-top:0;">
        <div class="menu-title">Settings & Support</div>
        <div class="menu-card">
            <a href="location.html" class="menu-item">
                <div class="menu-left">
                    <div class="menu-icon"><i class="fas fa-map-marker-alt"></i></div>
                    <div class="menu-text">Manage Addresses</div>
                </div>
                <i class="fas fa-chevron-right arrow-icon"></i>
            </a>
            <a href="#" class="menu-item">
                <div class="menu-left">
                    <div class="menu-icon"><i class="fas fa-language"></i></div>
                    <div class="menu-text">App Language</div>
                </div>
                <span style="font-size:0.8rem; color:#888; margin-right:10px;">English</span>
            </a>
            <a href="#" class="menu-item">
                <div class="menu-left">
                    <div class="menu-icon"><i class="fas fa-info-circle"></i></div>
                    <div class="menu-text">About Us</div>
                </div>
                <i class="fas fa-chevron-right arrow-icon"></i>
            </a>
            <a href="#" class="menu-item">
                <div class="menu-left">
                    <div class="menu-icon"><i class="fas fa-headset"></i></div>
                    <div class="menu-text">Help & Support</div>
                </div>
                <i class="fas fa-chevron-right arrow-icon"></i>
            </a>
        </div>
    </div>

    <button class="logout-btn">
        <i class="fas fa-sign-out-alt"></i> Log Out
    </button>

    <div class="bottom-dock">
        <a href="index.html" class="dock-item"><i class="fas fa-home"></i><span>Home</span></a>
        <a href="chat.html" class="dock-item"><i class="far fa-comment-dots"></i><span>Chat</span></a>
        <a href="add-service.html" class="dock-add-btn"><i class="fas fa-plus"></i></a>
        <a href="my-ads.html" class="dock-item"><i class="far fa-list-alt"></i><span>My Ads</span></a>
        <a href="account.html" class="dock-item active"><i class="far fa-user"></i><span>Profile</span></a>
    </div>

</body>
</html>
