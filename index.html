<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Service By Local - Premium</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #008F5D; /* Emerald Green */
            --bg-body: #F5F5F7; /* Apple Light Grey */
            --card-bg: #FFFFFF;
            --text-dark: #1D1D1F;
            --text-grey: #86868b;
            --shadow-float: 0 10px 40px rgba(0,0,0,0.08);
            --shadow-soft: 0 4px 12px rgba(0,0,0,0.03);
            --border-light: 1px solid rgba(0,0,0,0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-body);
            color: var(--text-dark);
            padding-bottom: 120px; /* Space for footer */
            overflow-x: hidden;
        }

        /* --- 1. PREMIUM WHITE HEADER (Clean & Glassy) --- */
        .app-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.85); /* Glass effect */
            backdrop-filter: blur(20px);
            padding: 15px 20px 20px 20px;
            border-bottom: var(--border-light);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        /* Logo Area */
        .brand-logo {
            height: 40px;
            display: flex;
            align-items: center;
        }
        .brand-logo img {
            height: 100%;
            width: auto;
            /* Logo.png yahan fit hoga */
        }
        /* Fallback text if logo missing */
        .logo-text { font-weight: 800; font-size: 1.4rem; color: var(--primary); letter-spacing: -0.5px; }

        /* Location & Notif */
        .header-actions { display: flex; align-items: center; gap: 12px; }

        .location-pill {
            background: #F2F2F7;
            padding: 8px 14px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-dark);
            display: flex; align-items: center; gap: 6px;
            cursor: pointer;
        }

        .notif-btn {
            position: relative;
            font-size: 1.3rem;
            color: var(--text-dark);
            width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center;
            background: #F2F2F7;
            border-radius: 50%;
            cursor: pointer;
        }
        .notif-dot {
            position: absolute; top: 10px; right: 10px;
            width: 8px; height: 8px;
            background: #FF3B30; border: 2px solid white; border-radius: 50%;
        }

        /* Animated Search Bar */
        .search-wrapper {
            position: relative;
            width: 100%;
        }
        .search-input {
            width: 100%;
            padding: 16px 20px 16px 50px;
            background: #F2F2F7;
            border: none;
            border-radius: 16px;
            font-size: 1rem;
            color: var(--text-dark);
            outline: none;
            transition: all 0.3s ease;
        }
        .search-input:focus { background: white; box-shadow: 0 0 0 2px var(--primary); }
        
        .search-icon {
            position: absolute;
            left: 18px; top: 50%; transform: translateY(-50%);
            color: #8E8E93; font-size: 1.1rem;
        }

        /* --- 2. SECTIONS --- */
        .section-header {
            padding: 25px 20px 15px 20px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .section-title { font-size: 1.25rem; font-weight: 700; color: var(--text-dark); letter-spacing: -0.5px; }
        .view-all { color: var(--primary); font-size: 0.9rem; font-weight: 600; text-decoration: none; }

        /* Popular Categories (Horizontal Scroll) */
        .pop-cats-scroll {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding: 0 20px 10px 20px;
            scrollbar-width: none;
        }
        .pop-cats-scroll::-webkit-scrollbar { display: none; }

        .pop-item {
            display: flex; flex-direction: column; align-items: center; gap: 10px;
            min-width: 80px; cursor: pointer;
        }

        .pop-icon-box {
            width: 70px; height: 70px;
            background: white;
            border-radius: 22px; /* Smooth Squircle */
            display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem;
            color: var(--primary);
            box-shadow: var(--shadow-soft);
            transition: transform 0.2s;
            border: 1px solid rgba(0,0,0,0.02);
        }
        .pop-item:active .pop-icon-box { transform: scale(0.95); background: var(--primary); color: white; }
        
        .pop-name { font-size: 0.8rem; font-weight: 600; color: var(--text-dark); }

        /* All Categories (2 Rows Grid) */
        .all-cats-container {
            overflow-x: auto;
            padding: 0 20px 10px 20px;
            scrollbar-width: none;
        }
        .all-cats-container::-webkit-scrollbar { display: none; }

        .all-cats-grid {
            display: grid;
            grid-template-rows: repeat(2, 1fr);
            grid-auto-flow: column;
            gap: 12px;
            padding-right: 20px;
        }

        .cat-chip {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: 85px; height: 85px;
            background: white;
            border-radius: 18px;
            gap: 6px;
            box-shadow: var(--shadow-soft);
            cursor: pointer;
            border: 1px solid rgba(0,0,0,0.02);
        }
        .cat-chip i { font-size: 1.5rem; color: var(--primary); opacity: 0.9; }
        .cat-chip span { font-size: 0.7rem; font-weight: 500; text-align: center; color: #555; line-height: 1.2; }


        /* --- 3. FRESH RECOMMENDATIONS (Iframe Placeholder) --- */
        /* Yeh area Card.html ko load karega */
        .cards-frame-container {
            width: 100%;
            min-height: 500px; /* Space reserved for cards */
            background: transparent;
            border: none;
            overflow: hidden;
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* --- 4. FLOATING DOCK NAV --- */
        .bottom-dock {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 500px;
            background: rgba(29, 29, 31, 0.95); /* Dark Premium Look like Screenshot 1 */
            backdrop-filter: blur(20px);
            padding: 12px 25px;
            border-radius: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            z-index: 1000;
        }

        .dock-item {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            color: #8E8E93; text-decoration: none; font-size: 0.7rem; font-weight: 500;
            transition: color 0.3s;
        }
        .dock-item.active { color: white; } /* White for active */
        .dock-item i { font-size: 1.4rem; }

        .dock-add-btn {
            width: 55px; height: 55px;
            background: var(--primary);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 1.8rem;
            transform: translateY(-25px);
            box-shadow: 0 10px 25px rgba(0, 143, 93, 0.4);
            border: 4px solid var(--bg-body); /* Cutout illusion */
        }
        .dock-add-btn:active { transform: translateY(-20px) scale(0.95); }

    </style>
</head>
<body>

    <header class="app-header">
        <div class="header-top">
            <div class="brand-logo">
                <span class="logo-text">Service by Local</span>
            </div>

            <div class="header-actions">
                <div class="location-pill">
                    <i class="fas fa-map-marker-alt" style="color:#FF3B30"></i> 
                    Mumbai <i class="fas fa-chevron-down" style="font-size:0.7rem; margin-left:2px; opacity:0.5;"></i>
                </div>
                <div class="notif-btn">
                    <i class="far fa-bell"></i>
                    <div class="notif-dot"></div>
                </div>
            </div>
        </div>

        <div class="search-wrapper">
            <i class="fas fa-search search-icon"></i>
            <input type="text" class="search-input" id="searchTypewriter" placeholder="Search for...">
        </div>
    </header>

    <div class="section-header">
        <div class="section-title">Popular Categories</div>
        <a href="#" class="view-all">See All</a>
    </div>
    
    <div class="pop-cats-scroll">
        <div class="pop-item">
            <div class="pop-icon-box"><i class="fas fa-tools"></i></div>
            <span class="pop-name">Repair</span>
        </div>
        <div class="pop-item">
            <div class="pop-icon-box"><i class="fas fa-paint-roller"></i></div>
            <span class="pop-name">Painting</span>
        </div>
        <div class="pop-item">
            <div class="pop-icon-box"><i class="fas fa-broom"></i></div>
            <span class="pop-name">Cleaning</span>
        </div>
        <div class="pop-item">
            <div class="pop-icon-box"><i class="fas fa-truck"></i></div>
            <span class="pop-name">Transport</span>
        </div>
        <div class="pop-item">
            <div class="pop-icon-box"><i class="fas fa-graduation-cap"></i></div>
            <span class="pop-name">Tuition</span>
        </div>
    </div>

    <div class="section-header" style="margin-top:5px;">
        <div class="section-title">All Categories</div>
    </div>

    <div class="all-cats-container">
        <div class="all-cats-grid">
            <div class="cat-chip"><i class="fas fa-blender"></i><span>Appliance</span></div>
            <div class="cat-chip"><i class="fas fa-home"></i><span>Home</span></div>
            <div class="cat-chip"><i class="fas fa-hard-hat"></i><span>Building</span></div>
            <div class="cat-chip"><i class="fas fa-car"></i><span>Rental</span></div>
            <div class="cat-chip"><i class="fas fa-bug"></i><span>Pest</span></div>
            <div class="cat-chip"><i class="fas fa-graduation-cap"></i><span>Education</span></div>
            <div class="cat-chip"><i class="fas fa-tint"></i><span>Tank</span></div>
            <div class="cat-chip"><i class="fas fa-glass-cheers"></i><span>Event</span></div>
            <div class="cat-chip"><i class="fas fa-camera"></i><span>Photo</span></div>
            <div class="cat-chip"><i class="fas fa-shopping-basket"></i><span>Daily</span></div>
        </div>
    </div>

    <div class="section-header">
        <div class="section-title">Fresh Recommendations</div>
    </div>
    
    <div class="cards-frame-container">
        <iframe src="cards.html" id="cardsFrame"></iframe>
    </div>


    <div class="bottom-dock">
        <a href="index.html" class="dock-item active">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="chat.html" class="dock-item">
            <i class="far fa-comment-dots"></i>
            <span>Chat</span>
        </a>
        <a href="add-service.html" class="dock-add-btn">
            <i class="fas fa-plus"></i>
        </a>
        <a href="my-ads.html" class="dock-item">
            <i class="far fa-list-alt"></i>
            <span>My Ads</span>
        </a>
        <a href="profile.html" class="dock-item">
            <i class="far fa-user"></i>
            <span>Profile</span>
        </a>
    </div>

    <script>
        // Typewriter Effect Script
        const searchInput = document.getElementById('searchTypewriter');
        const services = [
            "Appliance Repair",
            "AC Service",
            "Home Cleaning",
            "Plumbing Work",
            "Painters"
        ];
        
        let sIndex = 0;
        let charIndex = 0;
        let isDeleting = false;
        
        function typeEffect() {
            const current = services[sIndex];
            const prefix = "Search for ";
            
            // Calculate text to show
            let textToShow = isDeleting 
                ? current.substring(0, charIndex - 1) 
                : current.substring(0, charIndex + 1);
            
            searchInput.setAttribute('placeholder', prefix + textToShow);

            // Speed Logic
            let typeSpeed = 100;
            if(isDeleting) typeSpeed = 50;

            if(!isDeleting && textToShow === current) {
                // Pause at end
                isDeleting = true;
                typeSpeed = 2000;
            } else if(isDeleting && textToShow === "") {
                // Move to next
                isDeleting = false;
                sIndex = (sIndex + 1) % services.length;
                typeSpeed = 500;
            } else {
                charIndex = isDeleting ? charIndex - 1 : charIndex + 1;
            }

            setTimeout(typeEffect, typeSpeed);
        }

        // Start
        document.addEventListener('DOMContentLoaded', typeEffect);

        // Adjust Iframe Height based on content (Optional simple version)
        const iframe = document.getElementById('cardsFrame');
        iframe.onload = function() {
            // Slight delay to ensure content renders
            setTimeout(() => {
                // Logic to resize if on same domain
                // iframe.style.height = iframe.contentWindow.document.body.scrollHeight + 'px';
            }, 500);
        }
    </script>
</body>
</html>
