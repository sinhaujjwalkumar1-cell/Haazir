<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Select Service | Service by Local</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #008F5D;
            --primary-light: rgba(0, 143, 93, 0.1);
            --bg-body: #F5F5F7;
            --text-dark: #1D1D1F;
            --text-grey: #86868b;
            --card-white: #FFFFFF;
            --shadow-sm: 0 4px 15px rgba(0,0,0,0.04);
            --shadow-hover: 0 10px 25px rgba(0,0,0,0.08);
            --radius-xl: 24px;
            --radius-md: 16px;
        }

        * { margin:0; padding:0; box-sizing:border-box; font-family:'Outfit',sans-serif; -webkit-tap-highlight-color:transparent; }
        body { background:var(--bg-body); color:var(--text-dark); min-height: 100vh; }

        /* --- HEADER --- */
        .sub-header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(245, 245, 247, 0.9); /* Translucent match to body */
            backdrop-filter: blur(15px);
            padding: 15px 20px;
            display: flex; align-items: center; gap: 15px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .back-btn {
            width: 40px; height: 40px;
            background: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid rgba(0,0,0,0.05);
            color: var(--text-dark); text-decoration: none;
            box-shadow: var(--shadow-sm);
            transition: 0.2s;
        }
        .back-btn:active { transform: scale(0.95); }

        .header-title-box { display: flex; flex-direction: column; }
        .page-title { font-size: 1.2rem; font-weight: 800; color: var(--text-dark); line-height: 1.2; }
        .page-subtitle { font-size: 0.8rem; color: var(--text-grey); font-weight: 500; }

        /* --- HERO BANNER --- */
        .category-hero {
            margin: 20px;
            padding: 30px 25px;
            background: white;
            border-radius: var(--radius-xl);
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: var(--shadow-sm);
            position: relative; overflow: hidden;
        }
        
        /* Green gradient overlay */
        .category-hero::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(0, 143, 93, 0.05) 0%, rgba(0, 143, 93, 0.15) 100%);
            z-index: 0;
        }

        .hero-text { position: relative; z-index: 1; }
        .hero-h1 { font-size: 1.6rem; font-weight: 800; color: var(--primary); margin-bottom: 5px; }
        .hero-p { font-size: 0.9rem; color: var(--text-grey); max-width: 200px; line-height: 1.4; }

        .hero-icon {
            position: relative; z-index: 1;
            width: 70px; height: 70px;
            background: white; border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem; color: var(--primary);
            box-shadow: 0 8px 20px rgba(0, 143, 93, 0.15);
        }

        /* --- SEARCH FILTER --- */
        .filter-container { padding: 0 20px 20px; }
        .filter-box {
            background: white; width: 100%; padding: 14px 20px;
            border-radius: 16px; border: 1px solid rgba(0,0,0,0.04);
            display: flex; align-items: center; gap: 10px;
            box-shadow: var(--shadow-sm);
        }
        .filter-input { border: none; outline: none; width: 100%; font-size: 1rem; color: var(--text-dark); }
        .filter-input::placeholder { color: #ccc; }

        /* --- GRID LAYOUT --- */
        .sub-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 2 Column layout */
            gap: 15px;
            padding: 0 20px 100px 20px; /* Bottom padding for scroll */
        }

        .sub-card {
            background: white;
            padding: 20px;
            border-radius: 20px;
            border: 1px solid rgba(0,0,0,0.02);
            box-shadow: var(--shadow-sm);
            display: flex; flex-direction: column; align-items: flex-start;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            animation: fadeUp 0.5s ease backwards;
        }

        .sub-card:active { transform: scale(0.96); }
        
        /* Hover effects for desktop */
        @media(hover: hover) {
            .sub-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-hover); border-color: var(--primary-light); }
        }

        .sub-icon-box {
            width: 50px; height: 50px;
            background: var(--bg-body);
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            color: var(--text-dark);
            font-size: 1.4rem;
            margin-bottom: 15px;
            transition: 0.3s;
        }
        
        .sub-card:hover .sub-icon-box { background: var(--primary); color: white; }

        .sub-title { font-size: 1rem; font-weight: 700; color: var(--text-dark); margin-bottom: 5px; }
        .sub-desc { font-size: 0.75rem; color: var(--text-grey); line-height: 1.3; }
        
        .arrow-action {
            margin-top: auto; padding-top: 15px; width: 100%;
            display: flex; justify-content: flex-end;
        }
        .arrow-circle {
            width: 28px; height: 28px; border-radius: 50%;
            background: var(--bg-body); color: var(--text-dark);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.8rem; transition: 0.3s;
        }
        .sub-card:hover .arrow-circle { background: var(--primary-light); color: var(--primary); }

        /* --- ANIMATIONS --- */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- EMPTY STATE --- */
        .empty-state { text-align: center; padding: 50px 20px; display: none; }
        .empty-icon { font-size: 4rem; color: #ddd; margin-bottom: 15px; }
        .empty-text { color: var(--text-grey); }

    </style>
</head>
<body>

    <header class="sub-header">
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <div class="header-title-box">
            <span class="page-title" id="headerTitle">Categories</span>
            <span class="page-subtitle">Select a service</span>
        </div>
    </header>

    <div class="category-hero" id="heroSection">
        <div class="hero-text">
            <h1 class="hero-h1" id="heroTitle">Explore</h1>
            <p class="hero-p" id="heroDesc">Find the best local experts near you.</p>
        </div>
        <div class="hero-icon" id="heroIcon">
            <i class="fas fa-th-large"></i>
        </div>
    </div>

    <div class="filter-container">
        <div class="filter-box">
            <i class="fas fa-search" style="color: #999;"></i>
            <input type="text" class="filter-input" id="serviceSearch" placeholder="Find specific service..." onkeyup="filterServices()">
        </div>
    </div>

    <div class="sub-grid" id="subGrid">
        </div>
    
    <div class="empty-state" id="emptyState">
        <i class="fas fa-folder-open empty-icon"></i>
        <p class="empty-text">No services found in this category.</p>
    </div>

    <script>
        // --- 1. DATA DATABASE (Mapped from your Add-Service & Home Page) ---
        // Keys match the 'openCat()' function in index.html
        const servicesDB = {
            'repair': {
                title: "Appliance Repair",
                desc: "Expert technicians for all your home gadgets.",
                icon: "fas fa-tools",
                items: [
                    { name: "AC Repair", desc: "Service, Gas Refill & Installation", icon: "fas fa-snowflake", url: "cards.html?q=ac" },
                    { name: "Washing Machine", desc: "Automatic & Semi-automatic repair", icon: "fas fa-tshirt", url: "cards.html?q=washing" },
                    { name: "Refrigerator", desc: "Cooling issues & Compressor fix", icon: "fas fa-temperature-low", url: "cards.html?q=fridge" },
                    { name: "Microwave", desc: "Heating & Panel issues", icon: "fas fa-box-open", url: "cards.html?q=oven" },
                    { name: "Geyser", desc: "Heating element & installation", icon: "fas fa-shower", url: "cards.html?q=geyser" },
                    { name: "TV Repair", desc: "LED, LCD & Smart TV", icon: "fas fa-tv", url: "cards.html?q=tv" },
                    { name: "Laptop/PC", desc: "Hardware & Software solutions", icon: "fas fa-laptop", url: "cards.html?q=laptop" }
                ]
            },
            'home': {
                title: "Home Services",
                desc: "Keep your home running smoothly.",
                icon: "fas fa-home",
                items: [
                    { name: "Plumber", desc: "Leakage, Fittings & Tanks", icon: "fas fa-faucet", url: "cards.html?q=plumber" },
                    { name: "Electrician", desc: "Wiring, Switches & Fans", icon: "fas fa-bolt", url: "cards.html?q=electrician" },
                    { name: "Carpenter", desc: "Furniture repair & making", icon: "fas fa-chair", url: "cards.html?q=carpenter" },
                    { name: "Home Cleaning", desc: "Deep cleaning & dusting", icon: "fas fa-broom", url: "cards.html?q=cleaning" }
                ]
            },
            'painting': {
                title: "Painting",
                desc: "Give your walls a fresh look.",
                icon: "fas fa-paint-roller",
                items: [
                    { name: "Interior Painting", desc: "Wall putty & colors", icon: "fas fa-palette", url: "cards.html?q=paint" },
                    { name: "Exterior Painting", desc: "Weather proof coatings", icon: "fas fa-building", url: "cards.html?q=paint" },
                    { name: "Texture Art", desc: "Royal play & designs", icon: "fas fa-brush", url: "cards.html?q=texture" }
                ]
            },
            'construction': {
                title: "Construction",
                desc: "Build your dream with best materials.",
                icon: "fas fa-hard-hat",
                items: [
                    { name: "Building Material", desc: "Bricks, Sand & Cement", icon: "fas fa-cubes", url: "cards.html?q=material" },
                    { name: "Mason (Rajmistri)", desc: "Experienced builders", icon: "fas fa-hammer", url: "cards.html?q=mason" },
                    { name: "Labour", desc: "Helpers for construction", icon: "fas fa-user-friends", url: "cards.html?q=labour" },
                    { name: "Tiles & Marble", desc: "Flooring experts", icon: "fas fa-th", url: "cards.html?q=tiles" }
                ]
            },
            'transport': {
                title: "Transport",
                desc: "Move yourself or your goods easily.",
                icon: "fas fa-truck",
                items: [
                    { name: "E-Rickshaw", desc: "Local passenger rides", icon: "fas fa-bolt", url: "cards.html?q=erickshaw" },
                    { name: "Tempo/Truck", desc: "Goods carrier & shifting", icon: "fas fa-truck-moving", url: "cards.html?q=tempo" },
                    { name: "Packers & Movers", desc: "Full house shifting", icon: "fas fa-box", url: "cards.html?q=packers" }
                ]
            },
            'event': {
                title: "Events",
                desc: "Make your celebrations memorable.",
                icon: "fas fa-glass-cheers",
                items: [
                    { name: "Decoration", desc: "Balloon & Flower decor", icon: "fas fa-gifts", url: "cards.html?q=decor" },
                    { name: "DJ & Sound", desc: "Speakers & Systems", icon: "fas fa-music", url: "cards.html?q=dj" },
                    { name: "Catering", desc: "Food stalls & buffet", icon: "fas fa-utensils", url: "cards.html?q=food" },
                    { name: "Photography", desc: "Wedding & Party shoots", icon: "fas fa-camera", url: "cards.html?q=photo" }
                ]
            },
            'tuition': { // Maps to 'tutor' as well via alias check below
                title: "Education",
                desc: "Expert tutors for bright future.",
                icon: "fas fa-graduation-cap",
                items: [
                    { name: "School Subjects", desc: "Math, Science, English", icon: "fas fa-book", url: "cards.html?q=tutor" },
                    { name: "Music Class", desc: "Guitar, Piano, Vocal", icon: "fas fa-guitar", url: "cards.html?q=music" },
                    { name: "Computer", desc: "Basic & Coding", icon: "fas fa-desktop", url: "cards.html?q=computer" }
                ]
            },
            'beauty': {
                title: "Beauty",
                desc: "Salon at home.",
                icon: "fas fa-spa",
                items: [
                    { name: "Salon for Women", desc: "Facial, Waxing, Cuts", icon: "fas fa-female", url: "cards.html?q=salon" },
                    { name: "Men's Grooming", desc: "Haircut & Shaving", icon: "fas fa-cut", url: "cards.html?q=barber" },
                    { name: "Makeup Artist", desc: "Party & Bridal makeup", icon: "fas fa-magic", url: "cards.html?q=makeup" },
                    { name: "Mehndi", desc: "Artistic designs", icon: "fas fa-hand-sparkles", url: "cards.html?q=mehndi" }
                ]
            },
            'rental': {
                title: "Rentals",
                desc: "Don't buy, just rent it.",
                icon: "fas fa-key",
                items: [
                    { name: "Car Rental", desc: "Self drive or with driver", icon: "fas fa-car", url: "cards.html?q=car" },
                    { name: "Furniture", desc: "Beds, Sofa, Tables", icon: "fas fa-couch", url: "cards.html?q=furniture" },
                    { name: "Costumes", desc: "Fancy dress & Wedding", icon: "fas fa-tshirt", url: "cards.html?q=dress" }
                ]
            },
            'cleaning': {
                 title: "Cleaning",
                 desc: "Professional cleaning services.",
                 icon: "fas fa-broom",
                 items: [
                     { name: "Water Tank", desc: "Overhead & Underground", icon: "fas fa-water", url: "cards.html?q=tank" },
                     { name: "Full Home", desc: "Deep cleaning", icon: "fas fa-home", url: "cards.html?q=cleaning" },
                     { name: "Sofa/Carpet", desc: "Shampoo & Vacuum", icon: "fas fa-couch", url: "cards.html?q=sofa" }
                 ]
            },
             'pest': {
                 title: "Pest Control",
                 desc: "Remove unwanted guests.",
                 icon: "fas fa-bug",
                 items: [
                     { name: "General Pest", desc: "Cockroach & Ant", icon: "fas fa-spider", url: "cards.html?q=pest" },
                     { name: "Termite", desc: "Wood protection", icon: "fas fa-shield-alt", url: "cards.html?q=termite" }
                 ]
            }
        };

        // Aliases (incase index.html uses different names)
        servicesDB['tutor'] = servicesDB['tuition'];
        servicesDB['appliance'] = servicesDB['repair'];
        servicesDB['tank'] = servicesDB['cleaning'];

        // --- 2. LOGIC TO RENDER PAGE ---
        document.addEventListener('DOMContentLoaded', () => {
            // Get URL Parameter
            const params = new URLSearchParams(window.location.search);
            let catKey = params.get('cat');
            
            // Default to repair if empty or invalid
            if(!catKey || !servicesDB[catKey]) {
                console.log("Category not found, defaulting or showing error");
                // Optional: Redirect back or show error
                // catKey = 'repair'; // Uncomment to force default
            }

            if(servicesDB[catKey]) {
                renderCategory(servicesDB[catKey]);
            } else {
                document.getElementById('emptyState').style.display = 'block';
                document.getElementById('heroSection').style.display = 'none';
                document.getElementById('headerTitle').innerText = "Not Found";
            }
        });

        function renderCategory(data) {
            // Update Headers
            document.getElementById('headerTitle').innerText = data.title;
            document.getElementById('heroTitle').innerText = data.title;
            document.getElementById('heroDesc').innerText = data.desc;
            document.getElementById('heroIcon').innerHTML = `<i class="${data.icon}"></i>`;

            // Populate Grid
            const grid = document.getElementById('subGrid');
            grid.innerHTML = ''; // Clear existing

            data.items.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'sub-card';
                card.style.animationDelay = `${index * 0.05}s`; // Staggered animation
                
                // Add click event to go to next page
                card.onclick = () => {
                   // Navigate to listing page (cards.html) with filter
                   // Assuming cards.html can handle queries, or just open it directly
                   window.location.href = item.url || 'cards.html';
                };

                card.innerHTML = `
                    <div class="sub-icon-box"><i class="${item.icon}"></i></div>
                    <div class="sub-title">${item.name}</div>
                    <div class="sub-desc">${item.desc}</div>
                    <div class="arrow-action">
                        <div class="arrow-circle"><i class="fas fa-arrow-right"></i></div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // --- 3. SEARCH FILTER LOGIC ---
        function filterServices() {
            const query = document.getElementById('serviceSearch').value.toLowerCase();
            const cards = document.querySelectorAll('.sub-card');
            let hasVisible = false;

            cards.forEach(card => {
                const title = card.querySelector('.sub-title').innerText.toLowerCase();
                if(title.includes(query)) {
                    card.style.display = 'flex';
                    hasVisible = true;
                } else {
                    card.style.display = 'none';
                }
            });

            document.getElementById('emptyState').style.display = hasVisible ? 'none' : 'block';
        }
    </script>
</body>
</html>
