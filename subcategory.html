<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Service Menu | Service by Local</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #008F5D;
            --primary-light: rgba(0, 143, 93, 0.1);
            --bg-body: #F5F5F7;
            --text-dark: #1D1D1F;
            --text-grey: #86868b;
            --card-white: #FFFFFF;
            --shadow-sm: 0 4px 15px rgba(0,0,0,0.04);
            --shadow-hover: 0 10px 25px rgba(0,0,0,0.08);
            --radius-xl: 24px;
        }

        * { margin:0; padding:0; box-sizing:border-box; font-family:'Outfit',sans-serif; -webkit-tap-highlight-color:transparent; }
        body { background:var(--bg-body); color:var(--text-dark); min-height: 100vh; padding-bottom: 40px; }

        /* --- HEADER --- */
        .sub-header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(245, 245, 247, 0.95);
            backdrop-filter: blur(15px);
            padding: 15px 20px;
            display: flex; align-items: center; gap: 15px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .back-btn {
            width: 40px; height: 40px;
            background: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid rgba(0,0,0,0.05);
            color: var(--text-dark); cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: 0.2s;
        }
        .back-btn:active { transform: scale(0.95); }

        .header-title-box { display: flex; flex-direction: column; }
        .page-title { font-size: 1.2rem; font-weight: 800; color: var(--text-dark); line-height: 1.2; }
        .page-subtitle { font-size: 0.8rem; color: var(--text-grey); font-weight: 500; }

        /* --- HERO BANNER (Your Favorite Design) --- */
        .category-hero {
            margin: 20px; padding: 30px 25px;
            background: white; border-radius: var(--radius-xl);
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: var(--shadow-sm); position: relative; overflow: hidden;
            animation: fadeIn 0.5s ease;
            transition: all 0.3s ease;
        }
        
        .category-hero::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(0, 143, 93, 0.05) 0%, rgba(0, 143, 93, 0.15) 100%);
            z-index: 0;
        }

        .hero-text { position: relative; z-index: 1; }
        .hero-h1 { font-size: 1.6rem; font-weight: 800; color: var(--primary); margin-bottom: 5px; line-height: 1.2; }
        .hero-p { font-size: 0.9rem; color: var(--text-grey); max-width: 200px; line-height: 1.4; }

        .hero-icon {
            position: relative; z-index: 1;
            width: 70px; height: 70px;
            background: white; border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem; color: var(--primary);
            box-shadow: 0 8px 20px rgba(0, 143, 93, 0.15);
        }

        /* --- SEARCH --- */
        .filter-container { padding: 0 20px 20px; }
        .filter-box {
            background: white; width: 100%; padding: 14px 20px;
            border-radius: 16px; border: 1px solid rgba(0,0,0,0.04);
            display: flex; align-items: center; gap: 10px;
            box-shadow: var(--shadow-sm);
        }
        .filter-input { border: none; outline: none; width: 100%; font-size: 1rem; color: var(--text-dark); }

        /* --- GRID LAYOUT --- */
        .sub-grid {
            display: grid; grid-template-columns: repeat(2, 1fr);
            gap: 15px; padding: 0 20px 50px 20px;
        }

        /* --- CARD DESIGN (Your Favorite) --- */
        .sub-card {
            background: white; padding: 20px;
            border-radius: 20px; border: 1px solid rgba(0,0,0,0.02);
            box-shadow: var(--shadow-sm);
            display: flex; flex-direction: column; align-items: flex-start;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            animation: fadeUp 0.5s ease backwards;
            position: relative; overflow: hidden;
        }
        .sub-card:active { transform: scale(0.96); }

        .sub-icon-box {
            width: 50px; height: 50px;
            background: var(--bg-body); border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            color: var(--primary); font-size: 1.4rem;
            margin-bottom: 15px; transition: 0.3s;
        }
        
        .sub-card:hover .sub-icon-box { background: var(--primary); color: white; }

        .sub-title { font-size: 1rem; font-weight: 700; color: var(--text-dark); margin-bottom: 5px; line-height: 1.2; }
        .sub-desc { font-size: 0.75rem; color: var(--text-grey); line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        .arrow-action {
            margin-top: auto; padding-top: 15px; width: 100%;
            display: flex; justify-content: flex-end;
        }
        .arrow-circle {
            width: 28px; height: 28px; border-radius: 50%;
            background: var(--bg-body); color: var(--text-dark);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.8rem; transition: 0.3s;
        }
        .sub-card:hover .arrow-circle { background: var(--primary-light); color: var(--primary); }

        /* --- POPUP MODAL --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); backdrop-filter: blur(8px);
            z-index: 2000; opacity: 0; visibility: hidden;
            transition: 0.3s; display: flex; align-items: center; justify-content: center;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        
        .modal-content {
            background: #fff; width: 85%; max-width: 320px; border-radius: 28px;
            padding: 35px 25px; text-align: center;
            transform: scale(0.9); transition: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        .modal-overlay.active .modal-content { transform: scale(1); }

        .modal-icon {
            width: 60px; height: 60px; background: var(--primary-light); color: var(--primary);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem; margin: 0 auto 15px;
        }
        .modal-h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 8px; color: var(--text-dark); }
        .modal-p { font-size: 0.9rem; color: var(--text-grey); margin-bottom: 25px; line-height: 1.5; }
        .modal-btn {
            background: var(--primary); color: white; border: none;
            padding: 14px 0; width: 100%; border-radius: 50px;
            font-weight: 600; font-size: 0.95rem; cursor: pointer;
            box-shadow: 0 10px 20px rgba(0, 143, 93, 0.25);
        }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Empty State */
        .empty-state { text-align: center; padding: 50px 20px; display: none; }
        .empty-icon { font-size: 4rem; color: #e5e5e5; margin-bottom: 10px; }

    </style>
</head>
<body>

        // --- 2. STATE MANAGEMENT ---
        let currentMode = 'subcategory'; // 'subcategory' or 'skills'
        let currentCategory = null;

        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const catId = parseInt(params.get('cat'));

            if (catId) {
                // Find Category
                const category = categories.find(c => c.id === catId);
                if (category) {
                    currentCategory = category;
                    renderHero(category.name, category.description, category.icon);
                    renderSubcategories(category.subcategories);
                } else {
                    document.getElementById('gridContainer').innerHTML = "<p style='padding:20px; text-align:center;'>Category not found</p>";
                }
            } else {
                // If no ID, Default or redirect (Using Appliance for demo)
                const defaultCat = categories[0];
                currentCategory = defaultCat;
                renderHero(defaultCat.name, defaultCat.description, defaultCat.icon);
                renderSubcategories(defaultCat.subcategories);
            }
        });

        // --- 3. RENDERING FUNCTIONS ---
        
        function renderHero(title, subtitle, iconClass) {
            const hero = document.getElementById('heroContainer');
            // Re-render hero with animation
            hero.style.display = 'none';
            hero.offsetHeight; /* trigger reflow */
            hero.style.display = 'flex';
            
            hero.className = 'category-hero';
            hero.innerHTML = `
                <div class="hero-text">
                    <h1 class="hero-h1">${title}</h1>
                    <p class="hero-p">${subtitle}</p>
                </div>
                <div class="hero-icon">
                    <i class="${iconClass}"></i>
                </div>
            `;
        }

        function renderSubcategories(subs) {
            currentMode = 'subcategory';
            document.getElementById('headerTitle').innerText = "Services";
            document.getElementById('headerSubtitle').innerText = "Select a sub-category";
            
            const grid = document.getElementById('gridContainer');
            grid.innerHTML = '';

            subs.forEach((sub, index) => {
                const card = document.createElement('div');
                card.className = 'sub-card';
                card.style.animationDelay = `${index * 0.05}s`;
                card.onclick = () => openSkills(sub);

                card.innerHTML = `
                    <div class="sub-icon-box"><i class="${sub.icon}"></i></div>
                    <div class="sub-title">${sub.name}</div>
                    <div class="sub-desc">${sub.hindiName}</div>
                    <div class="arrow-action">
                        <div class="arrow-circle"><i class="fas fa-arrow-right"></i></div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openSkills(subcategory) {
            currentMode = 'skills';
            
            // 1. Update Hero to show Subcategory info
            renderHero(subcategory.name, subcategory.hindiName, subcategory.icon);
            
            // 2. Update Header Text
            document.getElementById('headerTitle').innerText = subcategory.name;
            document.getElementById('headerSubtitle').innerText = "Select specific service";
            window.scrollTo(0, 0);

            // 3. Render Skill Cards (Same design)
            const grid = document.getElementById('gridContainer');
            grid.innerHTML = '';

            // Handle empty skills
            if(!subcategory.skills || subcategory.skills.length === 0) {
                 grid.innerHTML = "<div style='grid-column:span 2; text-align:center; color:#999; padding:20px;'>No services listed yet.</div>";
                 return;
            }

            subcategory.skills.forEach((skill, index) => {
                const card = document.createElement('div');
                card.className = 'sub-card';
                card.style.animationDelay = `${index * 0.05}s`;
                card.onclick = () => openModal();

                card.innerHTML = `
                    <div class="sub-icon-box"><i class="fas fa-check"></i></div>
                    <div class="sub-title">${skill.name}</div>
                    <div class="sub-desc" style="color:#008F5D; font-weight:600;">₹${skill.price} <span style="font-weight:400; color:#999; font-size:0.7rem;">(Approx)</span></div>
                    <div class="arrow-action">
                        <div class="arrow-circle"><i class="fas fa-plus"></i></div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // --- 4. NAVIGATION & UTILS ---
        
        function goBack() {
            if (currentMode === 'skills') {
                // Go back to Subcategories list (Same Main Category)
                renderHero(currentCategory.name, currentCategory.description, currentCategory.icon);
                renderSubcategories(currentCategory.subcategories);
            } else {
                // Go back to Home
                window.location.href = 'index.html';
            }
        }

        function openModal() { document.getElementById('comingSoonModal').classList.add('active'); }
        function closeModal() { document.getElementById('comingSoonModal').classList.remove('active'); }

        function filterItems() {
            const query = document.getElementById('searchBox').value.toLowerCase();
            const cards = document.querySelectorAll('.sub-card');
            let hasVisible = false;

            cards.forEach(card => {
                const title = card.querySelector('.sub-title').innerText.toLowerCase();
                if(title.includes(query)) {
                    card.style.display = 'flex';
                    hasVisible = true;
                } else {
                    card.style.display = 'none';
                }
            });
            document.getElementById('emptyState').style.display = hasVisible ? 'none' : 'block';
        }

    </script>
</body>
</html>
