    <style>
        :root {
            --primary: #008F5D;
            --primary-light: rgba(0, 143, 93, 0.1);
            --bg-body: #F5F5F7;
            --text-dark: #1D1D1F;
            --text-grey: #86868b;
            --card-white: #FFFFFF;
            --shadow-sm: 0 4px 15px rgba(0,0,0,0.04);
            --shadow-hover: 0 10px 25px rgba(0,0,0,0.08);
            --radius-xl: 24px;
        }

        * { margin:0; padding:0; box-sizing:border-box; font-family:'Outfit',sans-serif; -webkit-tap-highlight-color:transparent; }
        body { background:var(--bg-body); color:var(--text-dark); min-height: 100vh; padding-bottom: 60px; }

        /* --- HEADER --- */
        .sub-header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(245, 245, 247, 0.95);
            backdrop-filter: blur(15px);
            padding: 15px 20px;
            display: flex; align-items: center; gap: 15px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .back-btn {
            width: 40px; height: 40px;
            background: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid rgba(0,0,0,0.05);
            color: var(--text-dark); cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: 0.2s;
        }
        .back-btn:active { transform: scale(0.95); }

        .header-title-box { display: flex; flex-direction: column; }
        .page-title { font-size: 1.2rem; font-weight: 800; color: var(--text-dark); line-height: 1.2; }
        .page-subtitle { font-size: 0.8rem; color: var(--text-grey); font-weight: 500; }

        /* --- SEARCH --- */
        .filter-container { padding: 15px 20px; }
        .filter-box {
            background: white; width: 100%; padding: 14px 20px;
            border-radius: 16px; border: 1px solid rgba(0,0,0,0.04);
            display: flex; align-items: center; gap: 10px;
            box-shadow: var(--shadow-sm);
        }
        .filter-input { border: none; outline: none; width: 100%; font-size: 1rem; color: var(--text-dark); }

        /* --- SECTION WRAPPERS --- */
        .category-section {
            scroll-margin-top: 85px; /* Thoda space upar choda taaki header ke piche na chhupe */
            margin-bottom: 10px;
            transition: background 0.5s ease;
            border-radius: 20px;
        }
        
        /* Highlight Animation - Green Flash */
        .highlight-section {
            animation: highlightFlash 2s ease;
            border: 2px solid var(--primary); /* Extra Border highlight */
        }
        @keyframes highlightFlash {
            0% { background: rgba(0, 143, 93, 0.0); transform: scale(1); }
            20% { background: rgba(0, 143, 93, 0.15); transform: scale(1.02); }
            100% { background: rgba(0, 143, 93, 0.0); transform: scale(1); }
        }

        /* --- HERO BANNER --- */
        .category-hero {
            margin: 20px; padding: 30px 25px;
            background: white; border-radius: var(--radius-xl);
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: var(--shadow-sm); position: relative; overflow: hidden;
        }
        
        .category-hero::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(0, 143, 93, 0.05) 0%, rgba(0, 143, 93, 0.15) 100%);
            z-index: 0;
        }

        .hero-text { position: relative; z-index: 1; }
        .hero-h1 { font-size: 1.6rem; font-weight: 800; color: var(--primary); margin-bottom: 5px; line-height: 1.2; }
        .hero-p { font-size: 0.9rem; color: var(--text-grey); max-width: 200px; line-height: 1.4; }

        .hero-icon {
            position: relative; z-index: 1;
            width: 70px; height: 70px;
            background: white; border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem; color: var(--primary);
            box-shadow: 0 8px 20px rgba(0, 143, 93, 0.15);
        }

        /* --- GRID LAYOUT --- */
        .sub-grid {
            display: grid; grid-template-columns: repeat(2, 1fr);
            gap: 15px; padding: 0 20px 20px 20px;
        }

        /* --- CARD STYLE --- */
        .sub-card {
            background: white; padding: 20px;
            border-radius: 20px; border: 1px solid rgba(0,0,0,0.02);
            box-shadow: var(--shadow-sm);
            display: flex; flex-direction: column; align-items: flex-start;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            animation: fadeUp 0.6s ease backwards;
        }
        .sub-card:active { transform: scale(0.96); }
        
        .sub-icon-box {
            width: 50px; height: 50px;
            background: var(--bg-body); border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            color: var(--primary); font-size: 1.4rem;
            margin-bottom: 15px; transition: 0.3s;
        }
        
        .sub-card:hover .sub-icon-box { background: var(--primary); color: white; }

        .sub-title { font-size: 1rem; font-weight: 700; color: var(--text-dark); margin-bottom: 5px; line-height: 1.2; }
        .sub-desc { font-size: 0.75rem; color: var(--text-grey); line-height: 1.3; }
        
        .arrow-action {
            margin-top: auto; padding-top: 15px; width: 100%;
            display: flex; justify-content: flex-end;
        }
        .arrow-circle {
            width: 28px; height: 28px; border-radius: 50%;
            background: var(--bg-body); color: var(--text-dark);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.8rem; transition: 0.3s;
        }
        .sub-card:hover .arrow-circle { background: var(--primary-light); color: var(--primary); }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- VIEWS UTILITY --- */
        #detailView { display: none; }

        /* --- MODAL --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); backdrop-filter: blur(8px);
            z-index: 2000; opacity: 0; visibility: hidden;
            transition: 0.3s; display: flex; align-items: center; justify-content: center;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        
        .modal-content {
            background: #fff; width: 85%; max-width: 320px; border-radius: 28px;
            padding: 35px 25px; text-align: center;
            transform: scale(0.9); transition: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        .modal-overlay.active .modal-content { transform: scale(1); }

        .modal-icon {
            width: 60px; height: 60px; background: var(--primary-light); color: var(--primary);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem; margin: 0 auto 15px;
        }
        .modal-h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 8px; color: var(--text-dark); }
        .modal-p { font-size: 0.9rem; color: var(--text-grey); margin-bottom: 25px; line-height: 1.5; }
        .modal-btn {
            background: var(--primary); color: white; border: none;
            padding: 14px 0; width: 100%; border-radius: 50px;
            font-weight: 600; font-size: 0.95rem; cursor: pointer;
            box-shadow: 0 10px 20px rgba(0, 143, 93, 0.25);

</head>

                id: '13', title: "Education", desc: "Tuition", icon: "fas fa-graduation-cap",
                subcategories: [
                    { id: '13-1', name: "Tution", desc: "School", icon: "fas fa-book-open", skills: [{name:"Maths", price:1000}, {name:"Science", price:1200}] },
                    { id: '13-2', name: "College", desc: "Higher", icon: "fas fa-university", skills: [{name:"Engineering", price:1500}, {name:"Medical", price:1600}] },
                    { id: '13-3', name: "Competitive", desc: "Exams", icon: "fas fa-file-alt", skills: [{name:"UPSC", price:2000}, {name:"SSC", price:1500}] },
                    { id: '13-4', name: "Language", desc: "Speak", icon: "fas fa-language", skills: [{name:"English", price:1200}, {name:"French", price:1500}] },
                    { id: '13-5', name: "Driving", desc: "Learn", icon: "fas fa-car", skills: [{name:"Car", price:500}, {name:"Bike", price:300}] },
                    { id: '13-6', name: "Music", desc: "Instruments", icon: "fas fa-music", skills: [{name:"Guitar", price:800}, {name:"Piano", price:1000}] },
                    { id: '13-7', name: "Dance", desc: "Move", icon: "fas fa-user-friends", skills: [{name:"Bollywood", price:500}, {name:"Classical", price:600}] },
                    { id: '13-8', name: "Computer", desc: "Tech", icon: "fas fa-laptop-code", skills: [{name:"Basic", price:1000}, {name:"Coding", price:1500}] }
                ]
            }
        ];

        // --- RENDER LOGIC ---
        let currentMode = 'main'; // 'main' or 'detail'

        document.addEventListener('DOMContentLoaded', () => {
            renderMainList(); // Show All Categories Initially
            handleUrlParams(); // Scroll if coming from home
        });

        // 1. RENDER MAIN LIST (Shows ALL categories & subcategories)
        function renderMainList() {
            const container = document.getElementById('mainListView');
            container.innerHTML = '';

            fullDatabase.forEach(cat => {
                // Section Wrapper
                const section = document.createElement('div');
                section.className = 'category-section';
                section.id = `cat-${cat.id}`;

                // Hero Header for Category
                const hero = document.createElement('div');
                hero.className = 'category-hero';
                hero.innerHTML = `
                    <div class="hero-text">
                        <h1 class="hero-h1">${cat.title}</h1>
                        <p class="hero-p">${cat.desc}</p>
                    </div>
                    <div class="hero-icon"><i class="${cat.icon}"></i></div>
                `;
                section.appendChild(hero);

                // Grid for Subcategories
                const grid = document.createElement('div');
                grid.className = 'sub-grid';

                cat.subcategories.forEach(sub => {
                    const card = document.createElement('div');
                    card.className = 'sub-card';
                    // Pass the PARENT CATEGORY + SUB to the drill down function
                    card.onclick = () => openAllSkillsForCategory(cat, sub.id);

                    card.innerHTML = `
                        <div class="sub-icon-box"><i class="${sub.icon}"></i></div>
                        <div class="sub-title">${sub.name}</div>
                        <div class="sub-desc">${sub.desc}</div>
                        <div class="arrow-action">
                            <div class="arrow-circle"><i class="fas fa-arrow-right"></i></div>
                        </div>
                    `;
                    grid.appendChild(card);
                });

                section.appendChild(grid);
                container.appendChild(section);
            });
        }

        // 2. DRILL DOWN: OPEN ALL SKILLS FOR THAT CATEGORY
        function openAllSkillsForCategory(parentCategory, clickedSubId) {
            currentMode = 'detail';
            
            // Hide Main List, Show Detail View
            document.getElementById('mainListView').style.display = 'none';
            const detailView = document.getElementById('detailView');
            detailView.style.display = 'block';
            detailView.innerHTML = ''; // Clear previous

            // Update Header
            document.getElementById('headerTitle').innerText = parentCategory.title;
            document.getElementById('headerSubtitle').innerText = "Select specific service";
            window.scrollTo(0, 0);

            // Loop through ALL subcategories of the parent
            parentCategory.subcategories.forEach(sub => {
                const wrapper = document.createElement('div');
                wrapper.className = 'category-section'; 
                wrapper.id = `sub-detail-${sub.id}`; 

                const hero = document.createElement('div');
                hero.className = 'category-hero';
                hero.innerHTML = `
                    <div class="hero-text">
                        <h1 class="hero-h1">${sub.name}</h1>
                        <p class="hero-p">${sub.desc}</p>
                    </div>
                    <div class="hero-icon"><i class="${sub.icon}"></i></div>
                `;
                wrapper.appendChild(hero);

                const grid = document.createElement('div');
                grid.className = 'sub-grid';

                if(sub.skills && sub.skills.length > 0) {
                    sub.skills.forEach((skill, index) => {
                        const card = document.createElement('div');
                        card.className = 'sub-card';
                        card.style.animationDelay = `${index * 0.05}s`;
                        card.onclick = () => openModal();

                        card.innerHTML = `
                            <div class="sub-icon-box"><i class="fas fa-check"></i></div>
                            <div class="sub-title">${skill.name}</div>
                            <div class="sub-desc" style="color:#008F5D; font-weight:600;">
                                ₹${skill.price} <span style="font-weight:400; color:#999; font-size:0.7rem;">(Approx)</span>
                            </div>
                            <div class="arrow-action">
                                <div class="arrow-circle"><i class="fas fa-plus"></i></div>
                            </div>
                        `;
                        grid.appendChild(card);
                    });
                } else {
                    grid.innerHTML = "<p style='padding:20px; color:#999;'>No services added yet.</p>";
                }

                wrapper.appendChild(grid);
                detailView.appendChild(wrapper);
            });

            // AUTO SCROLL TO THE CLICKED SUB-CATEGORY
            setTimeout(() => {
                const targetEl = document.getElementById(`sub-detail-${clickedSubId}`);
                if(targetEl) {
                    targetEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    targetEl.classList.add('highlight-section');
                    setTimeout(() => targetEl.classList.remove('highlight-section'), 2000);
                }
            }, 100);
        }

        // 3. AUTO SCROLL (FROM HOME PAGE) - FIXED MAPPING
        function handleUrlParams() {
            const params = new URLSearchParams(window.location.search);
            const catName = params.get('cat'); // e.g. "construction"
            
            // Map the NAME from URL to the ID in Database
            const catMap = {
                'repair': '1',
                'appliance': '1',
                'painting': '2',
                'cleaning': '2',
                'home': '2',
                'construction': '3',
                'build': '3',
                'rental': '4',
                'transport': '4',
                'event': '5',
                'beauty': '6',
                'pest': '7',
                'erickshaw': '8',
                'tank': '9',
                'rent': '10',
                'photo': '11',
                'daily': '12',
                'tuition': '13',
                'tutor': '13'
            };

            if (catName && catMap[catName]) {
                const targetId = catMap[catName]; // Get the Number ID
                
                setTimeout(() => {
                    const el = document.getElementById(`cat-${targetId}`);
                    if (el) {
                        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        el.classList.add('highlight-section');
                        // Remove highlight after 2 seconds
                        setTimeout(() => el.classList.remove('highlight-section'), 2000);
                    }
                }, 300);
            }
        }

        // 4. NAVIGATION
        function goBack() {
            if (currentMode === 'detail') {
                document.getElementById('detailView').style.display = 'none';
                document.getElementById('mainListView').style.display = 'block';
                document.getElementById('headerTitle').innerText = "Services";
                document.getElementById('headerSubtitle').innerText = "Select category & service";
                currentMode = 'main';
                window.scrollTo(0,0);
            } else {
                window.location.href = 'index.html';
            }
        }

        function openModal() { document.getElementById('comingSoonModal').classList.add('active'); }
        function closeModal() { document.getElementById('comingSoonModal').classList.remove('active'); }

        // 5. SEARCH FILTER
        function filterServices() {
            const query = document.getElementById('serviceSearch').value.toLowerCase();
            const activeContainer = currentMode === 'main' ? document.getElementById('mainListView') : document.getElementById('detailView');
            const sections = activeContainer.querySelectorAll('.category-section');

            sections.forEach(sec => {
                const cards = sec.querySelectorAll('.sub-card');
                let hasVisible = false;
                cards.forEach(card => {
                    if(card.innerText.toLowerCase().includes(query)) {
                        card.style.display = 'flex';
                        hasVisible = true;
                    } else {
                        card.style.display = 'none';
                    }
                });
                sec.style.display = hasVisible ? 'block' : 'none';
            });
        }
    </script>
</body>
</html>
