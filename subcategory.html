<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>All Services | Service by Local</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #008F5D; /* Service by Local Green */
            --primary-light: rgba(0, 143, 93, 0.1);
            --bg-body: #F5F5F7;
            --text-dark: #1D1D1F;
            --text-grey: #86868b;
            --card-white: #FFFFFF;
            --shadow-sm: 0 4px 15px rgba(0,0,0,0.04);
            --shadow-hover: 0 10px 25px rgba(0,0,0,0.08);
            --radius-xl: 24px;
        }

        * { margin:0; padding:0; box-sizing:border-box; font-family:'Outfit',sans-serif; -webkit-tap-highlight-color:transparent; }
        body { background:var(--bg-body); color:var(--text-dark); min-height: 100vh; padding-bottom: 50px; }

        /* --- HEADER --- */
        .sub-header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(245, 245, 247, 0.95);
            backdrop-filter: blur(15px);
            padding: 15px 20px;
            display: flex; align-items: center; gap: 15px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .back-btn {
            width: 40px; height: 40px;
            background: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid rgba(0,0,0,0.05);
            color: var(--text-dark); text-decoration: none;
            box-shadow: var(--shadow-sm);
            transition: 0.2s;
        }
        .back-btn:active { transform: scale(0.95); }

        .header-title-box { display: flex; flex-direction: column; }
        .page-title { font-size: 1.2rem; font-weight: 800; color: var(--text-dark); line-height: 1.2; }
        .page-subtitle { font-size: 0.8rem; color: var(--text-grey); font-weight: 500; }

        /* --- SEARCH FILTER --- */
        .filter-container { padding: 20px 20px 10px; }
        .filter-box {
            background: white; width: 100%; padding: 14px 20px;
            border-radius: 16px; border: 1px solid rgba(0,0,0,0.04);
            display: flex; align-items: center; gap: 10px;
            box-shadow: var(--shadow-sm);
        }
        .filter-input { border: none; outline: none; width: 100%; font-size: 1rem; color: var(--text-dark); }
        .filter-input::placeholder { color: #ccc; }

        /* --- SECTION STYLES --- */
        .category-section {
            padding: 25px 20px 0 20px;
            scroll-margin-top: 80px; /* For smooth scrolling offset */
        }

        .cat-header {
            display: flex; align-items: center; gap: 10px;
            margin-bottom: 15px;
        }
        
        /* Category Icon in Title */
        .cat-header-icon {
            width: 35px; height: 35px;
            background: var(--primary-light);
            color: var(--primary);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem;
        }

        .cat-title { font-size: 1.3rem; font-weight: 700; color: var(--text-dark); letter-spacing: -0.5px; }

        /* --- GRID LAYOUT --- */
        .sub-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 2 Columns */
            gap: 15px;
        }

        .sub-card {
            background: white;
            padding: 20px;
            border-radius: 20px;
            border: 1px solid rgba(0,0,0,0.02);
            box-shadow: var(--shadow-sm);
            display: flex; flex-direction: column; align-items: flex-start;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            /* Keep original fade animation */
            animation: fadeUp 0.6s ease backwards; 
        }

        .sub-card:active { transform: scale(0.96); }
        
        /* Icons are now GREEN as requested */
        .sub-icon-box {
            width: 50px; height: 50px;
            background: var(--bg-body);
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            color: var(--primary); /* CHANGED TO GREEN */
            font-size: 1.4rem;
            margin-bottom: 15px;
            transition: 0.3s;
        }
        
        .sub-card:hover .sub-icon-box { background: var(--primary); color: white; }

        .sub-title { font-size: 1rem; font-weight: 700; color: var(--text-dark); margin-bottom: 5px; }
        .sub-desc { font-size: 0.75rem; color: var(--text-grey); line-height: 1.3; }
        
        .arrow-action {
            margin-top: auto; padding-top: 15px; width: 100%;
            display: flex; justify-content: flex-end;
        }
        .arrow-circle {
            width: 28px; height: 28px; border-radius: 50%;
            background: var(--bg-body); color: var(--text-dark);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.8rem; transition: 0.3s;
        }
        .sub-card:hover .arrow-circle { background: var(--primary-light); color: var(--primary); }

        /* --- ANIMATIONS --- */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

    </style>
</head>
<body>

    <header class="sub-header">
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <div class="header-title-box">
            <span class="page-title">Service Menu</span>
            <span class="page-subtitle">Select category & service</span>
        </div>
    </header>

    <div class="filter-container">
        <div class="filter-box">
            <i class="fas fa-search" style="color: #999;"></i>
            <input type="text" class="filter-input" id="serviceSearch" placeholder="Search any service..." onkeyup="filterServices()">
        </div>
    </div>

    <div id="mainContent">
        </div>
    
    <div style="height: 50px;"></div> <script>
        // --- DATA ---
        // Same Database
        const servicesDB = {
            'repair': {
                title: "Appliance Repair",
                icon: "fas fa-tools",
                items: [
                    { name: "AC Repair", desc: "Service & Gas Refill", icon: "fas fa-snowflake", url: "cards.html?q=ac" },
                    { name: "Washing Machine", desc: "Repair & Install", icon: "fas fa-tshirt", url: "cards.html?q=washing" },
                    { name: "Refrigerator", desc: "Cooling issues", icon: "fas fa-temperature-low", url: "cards.html?q=fridge" },
                    { name: "Microwave", desc: "Heating fix", icon: "fas fa-box-open", url: "cards.html?q=oven" },
                    { name: "Geyser", desc: "Element repair", icon: "fas fa-shower", url: "cards.html?q=geyser" },
                    { name: "TV Repair", desc: "Screen & Audio", icon: "fas fa-tv", url: "cards.html?q=tv" }
                ]
            },
            'home': {
                title: "Home Services",
                icon: "fas fa-home",
                items: [
                    { name: "Plumber", desc: "Leakage & Fittings", icon: "fas fa-faucet", url: "cards.html?q=plumber" },
                    { name: "Electrician", desc: "Wiring & Fans", icon: "fas fa-bolt", url: "cards.html?q=electrician" },
                    { name: "Carpenter", desc: "Furniture work", icon: "fas fa-chair", url: "cards.html?q=carpenter" },
                    { name: "Cleaning", desc: "Deep cleaning", icon: "fas fa-broom", url: "cards.html?q=cleaning" }
                ]
            },
            'construction': {
                title: "Construction",
                icon: "fas fa-hard-hat",
                items: [
                    { name: "Material", desc: "Bricks & Sand", icon: "fas fa-cubes", url: "cards.html?q=material" },
                    { name: "Mason", desc: "Rajmistri", icon: "fas fa-hammer", url: "cards.html?q=mason" },
                    { name: "Labour", desc: "Helpers", icon: "fas fa-user-friends", url: "cards.html?q=labour" },
                    { name: "Tiles", desc: "Flooring expert", icon: "fas fa-th", url: "cards.html?q=tiles" }
                ]
            },
            'beauty': {
                title: "Beauty & Spa",
                icon: "fas fa-spa",
                items: [
                    { name: "Salon (Women)", desc: "Facial & Waxing", icon: "fas fa-female", url: "cards.html?q=salon" },
                    { name: "Men's Grooming", desc: "Haircut & Beard", icon: "fas fa-cut", url: "cards.html?q=barber" },
                    { name: "Makeup", desc: "Bridal & Party", icon: "fas fa-magic", url: "cards.html?q=makeup" },
                    { name: "Mehndi", desc: "Henna Art", icon: "fas fa-hand-sparkles", url: "cards.html?q=mehndi" }
                ]
            },
            'event': {
                title: "Events",
                icon: "fas fa-glass-cheers",
                items: [
                    { name: "Decoration", desc: "Balloon & Flower", icon: "fas fa-gifts", url: "cards.html?q=decor" },
                    { name: "DJ Sound", desc: "Party speakers", icon: "fas fa-music", url: "cards.html?q=dj" },
                    { name: "Catering", desc: "Food stalls", icon: "fas fa-utensils", url: "cards.html?q=food" }
                ]
            },
            'transport': {
                title: "Transport",
                icon: "fas fa-truck",
                items: [
                    { name: "E-Rickshaw", desc: "Local rides", icon: "fas fa-bolt", url: "cards.html?q=erickshaw" },
                    { name: "Tempo", desc: "Goods carrier", icon: "fas fa-truck-moving", url: "cards.html?q=tempo" }
                ]
            },
            'tuition': { 
                title: "Education",
                icon: "fas fa-graduation-cap",
                items: [
                    { name: "Tutor", desc: "School subjects", icon: "fas fa-book", url: "cards.html?q=tutor" },
                    { name: "Music", desc: "Learn instruments", icon: "fas fa-guitar", url: "cards.html?q=music" },
                    { name: "Computer", desc: "Coding classes", icon: "fas fa-desktop", url: "cards.html?q=computer" }
                ]
            },
             'rental': {
                title: "Rentals",
                icon: "fas fa-key",
                items: [
                    { name: "Car Rental", desc: "Self drive", icon: "fas fa-car", url: "cards.html?q=car" },
                    { name: "Furniture", desc: "Home setup", icon: "fas fa-couch", url: "cards.html?q=furniture" }
                ]
            },
             'pest': {
                 title: "Pest Control",
                 icon: "fas fa-bug",
                 items: [
                     { name: "Pest Control", desc: "Insects removal", icon: "fas fa-spider", url: "cards.html?q=pest" }
                 ]
            }
        };

        // Aliases for compatibility
        servicesDB['tutor'] = servicesDB['tuition'];
        servicesDB['appliance'] = servicesDB['repair'];
        servicesDB['tank'] = servicesDB['home']; // Assuming Tank is under Home for now

        // --- RENDER LOGIC ---
        document.addEventListener('DOMContentLoaded', () => {
            const mainContent = document.getElementById('mainContent');
            const renderedKeys = new Set(); // To avoid duplicates (aliases)

            // Loop through all categories in DB
            for (const [key, data] of Object.entries(servicesDB)) {
                // Check if we already rendered this object (handles aliases like 'tutor'='tuition')
                if (renderedKeys.has(data)) continue;
                renderedKeys.add(data);

                // Create Section Wrapper
                const section = document.createElement('div');
                section.className = 'category-section';
                section.id = `cat-${key}`; // ID for scrolling

                // Create Header
                const header = document.createElement('div');
                header.className = 'cat-header';
                header.innerHTML = `
                    <div class="cat-header-icon"><i class="${data.icon}"></i></div>
                    <div class="cat-title">${data.title}</div>
                `;
                section.appendChild(header);

                // Create Grid
                const grid = document.createElement('div');
                grid.className = 'sub-grid';

                // Populate Items
                data.items.forEach((item, index) => {
                    const card = document.createElement('div');
                    card.className = 'sub-card';
                    card.style.animationDelay = `${index * 0.05}s`; 
                    
                    card.onclick = () => window.location.href = item.url;

                    card.innerHTML = `
                        <div class="sub-icon-box"><i class="${item.icon}"></i></div>
                        <div class="sub-title">${item.name}</div>
                        <div class="sub-desc">${item.desc}</div>
                        <div class="arrow-action">
                            <div class="arrow-circle"><i class="fas fa-arrow-right"></i></div>
                        </div>
                    `;
                    grid.appendChild(card);
                });

                section.appendChild(grid);
                mainContent.appendChild(section);
            }

            // --- AUTO SCROLL LOGIC ---
            const params = new URLSearchParams(window.location.search);
            const targetCat = params.get('cat');

            if(targetCat) {
                // Slight delay to ensure rendering is complete
                setTimeout(() => {
                    const targetElement = document.getElementById(`cat-${targetCat}`);
                    if(targetElement) {
                        targetElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        
                        // Optional: Flash effect to highlight section
                        targetElement.style.transition = "background 0.5s";
                        targetElement.style.background = "rgba(0, 143, 93, 0.05)";
                        setTimeout(() => { targetElement.style.background = "transparent"; }, 1000);
                    }
                }, 100);
            }
        });

        // Search Filter (Updated to search across all sections)
        function filterServices() {
            const query = document.getElementById('serviceSearch').value.toLowerCase();
            const cards = document.querySelectorAll('.sub-card');
            const sections = document.querySelectorAll('.category-section');

            cards.forEach(card => {
                const title = card.querySelector('.sub-title').innerText.toLowerCase();
                const desc = card.querySelector('.sub-desc').innerText.toLowerCase();
                
                if(title.includes(query) || desc.includes(query)) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });

            // Hide empty sections if all their cards are hidden
            sections.forEach(sec => {
                const visibleCards = sec.querySelectorAll('.sub-card[style="display: flex;"]');
                // Note: display:flex is set by JS inline above. Default css is flex too.
                // We check if any card is NOT set to display:none
                let hasVisible = false;
                sec.querySelectorAll('.sub-card').forEach(c => {
                    if(c.style.display !== 'none') hasVisible = true;
                });
                
                sec.style.display = hasVisible ? 'block' : 'none';
            });
        }
    </script>
</body>
</html>
